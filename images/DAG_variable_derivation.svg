<text x="1082.5" y="546.3" text-anchor="middle" font-size="13" font-weight="bold">ΔDOC_w</text>
<text x="1082.5" y="562.3" text-anchor="middle" font-size="13">= downstream_DOC_w</text>
<text x="1082.5" y="578.3" text-anchor="middle" font-size="13">− upstream_DOC_w</text>
<rect x="1125" y="640" width="185" height="66" rx="7" fill="#ececec" stroke="#777" stroke-width="2"/>
<text x="1217.5" y="661.3" text-anchor="middle" font-size="13" font-weight="bold">ΔDOC_s</text>
<text x="1217.5" y="677.3" text-anchor="middle" font-size="13">= downstream_DOC_s</text>
<text x="1217.5" y="693.3" text-anchor="middle" font-size="13">− upstream_DOC_s</text>
<rect x="590" y="645" width="205" height="80" rx="7" fill="#f8d7d7" stroke="#c0392b" stroke-width="2"/>
<text x="692.5" y="673.3" text-anchor="middle" font-size="13" font-weight="bold">B = ΔDOC_s − ΔDOC_w</text>
<text x="692.5" y="689.3" text-anchor="middle" font-size="13">(beaver seasonal</text>
<text x="692.5" y="705.3" text-anchor="middle" font-size="13">modification)</text>
<rect x="860" y="645" width="200" height="80" rx="7" fill="#e8dbf5" stroke="#7d3c98" stroke-width="2"/>
<text x="960.0" y="673.3" text-anchor="middle" font-size="13" font-weight="bold">S = upstream_DOC_s</text>
<text x="960.0" y="689.3" text-anchor="middle" font-size="13">− upstream_DOC_w</text>
<text x="960.0" y="705.3" text-anchor="middle" font-size="13">(inherited seasonal signal)</text>
<rect x="735" y="790" width="190" height="58" rx="7" fill="#fff3c4" stroke="#c9a227" stroke-width="2"/>
<text x="830.0" y="815.3" text-anchor="middle" font-size="13" font-weight="bold">G = B / S</text>
<text x="830.0" y="831.3" text-anchor="middle" font-size="13">(seasonal Gain)</text>
<rect x="1010" y="790" width="215" height="58" rx="7" fill="#fff3c4" stroke="#c9a227" stroke-width="2"/>
<text x="1117.5" y="815.3" text-anchor="middle" font-size="13" font-weight="bold">F = A_floodplain / A_beaver</text>
<text x="1117.5" y="831.3" text-anchor="middle" font-size="13">(Footprint contrast)</text>
<rect x="850" y="895" width="215" height="62" rx="7" fill="#fbe0c8" stroke="#d35400" stroke-width="2"/>
<text x="957.5" y="922.3" text-anchor="middle" font-size="13" font-weight="bold">L = |G| · F</text>
<text x="957.5" y="938.3" text-anchor="middle" font-size="13">(spatiotemporal Leverage)</text>
<rect x="1250" y="895" width="290" height="62" rx="7" fill="#fbe0c8" stroke="#d35400" stroke-width="2"/>
<text x="1395.0" y="922.3" text-anchor="middle" font-size="13" font-weight="bold">M_s = |R_s| · F</text>
<text x="1395.0" y="938.3" text-anchor="middle" font-size="13">(amplification factor, per season)</text>
<rect x="15" y="600" width="370" height="330" rx="8" fill="white" stroke="#888"/>
<rect x="30" y="625" width="34" height="18" rx="5" fill="#e6e6e6" stroke="#555"/><text x="75" y="639" font-size="13">Time-invariant engineered / landscape controls</text>
<rect x="30" y="655" width="34" height="18" rx="5" fill="#ead9f5" stroke="#8e44ad"/><text x="75" y="669" font-size="13">Hydrology (water residence time, WRT)</text>
<rect x="30" y="685" width="34" height="18" rx="5" fill="#dff0d8" stroke="#3a7d3a"/><text x="75" y="699" font-size="13">Biological state</text>
<rect x="30" y="715" width="34" height="18" rx="5" fill="#f3e6d3" stroke="#a67c52"/><text x="75" y="729" font-size="13">Organic matter inputs</text>
<rect x="30" y="745" width="34" height="18" rx="5" fill="#d6e8f7" stroke="#2b6cb0"/><text x="75" y="759" font-size="13">Observed DOC concentrations</text>
<rect x="30" y="775" width="34" height="18" rx="5" fill="#ececec" stroke="#777"/><text x="75" y="789" font-size="13">Derived quantities (calculated)</text>
<path d="M30,815 L64,815" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="75" y="820" font-size="13">Causal pathway</text>
<path d="M30,845 L64,845" stroke="#1e8449" stroke-width="2.5" marker-end="url(#g)"/><text x="75" y="850" font-size="13">Seasonal persistence of the hydrologic template</text>
<path d="M30,875 L64,875" stroke="#333" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#d)"/><text x="75" y="880" font-size="13">Deterministic contrast / calculation</text>
<text x="30" y="915" font-size="12" fill="#444">Subscripts: w = winter, s = summer. Names: Gain, Footprint, Leverage.</text>
<rect x="1330" y="520" width="255" height="230" rx="8" fill="white" stroke="#888"/>
<text x="1342" y="545" font-size="12" font-weight="bold">How to read</text>
<text x="1342" y="562" font-size="12">The same causal mechanism operates in</text>
<text x="1342" y="579" font-size="12">winter and summer (top panels). Downstream</text>
<text x="1342" y="596" font-size="12">DOC inherits the upstream DOC state and is</text>
<text x="1342" y="613" font-size="12">modified by local hydrological and biological</text>
<text x="1342" y="630" font-size="12">processes whose expression depends on</text>
<text x="1342" y="647" font-size="12">season. ΔDOC, B, S, G, F, L and M are</text>
<text x="1342" y="664" font-size="12">calculated outside the causal DAG from the</text>
<text x="1342" y="681" font-size="12">observed (or posterior) concentrations.</text>
<text x="1342" y="698" font-size="12">G &gt; 0 reinforces the inherited seasonal</text>
<text x="1342" y="715" font-size="12">signal, −1 &lt; G &lt; 0 dampens it, G &lt; −1</text>
<text x="1342" y="732" font-size="12">reverses it.</text>
<path d="M1275,706 L1370,760" fill="none" stroke="#333" stroke-width="2" marker-end="url(#d)" stroke-dasharray="6 5"/><path d="M1060,725 Q1200,780 1290,790" fill="none" stroke="#333" stroke-width="2" marker-end="url(#d)" stroke-dasharray="6 5"/><rect x="1290" y="760" width="200" height="58" rx="7" fill="#fff3c4" stroke="#c9a227" stroke-width="2"/><text x="1390" y="784" text-anchor="middle" font-size="13" font-weight="bold">R_s = ΔDOC_s / |S|</text><text x="1390" y="802" text-anchor="middle" font-size="13">(Relative response)</text></svg>